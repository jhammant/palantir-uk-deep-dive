name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily refresh of contracts from the government APIs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh contracts (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/fetch_contracts.py
          if ! git diff --quiet -- data/; then
            git config user.name "palantir-uk bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/ sources/raw/
            git commit -m "chore(data): daily contracts refresh"
            git push
          fi
      - name: Build site bundle
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
